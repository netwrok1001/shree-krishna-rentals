kind = "web"
previewPath = "/"
title = "Wayfare & Homes"
description = "A travel and property marketplace for booking chauffeur-driven cars for tours and browsing homes to rent or buy, with inquiry flows for both."
version = "1.0.0"
id = "artifacts/travel-estates"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21629

[services.development]
run = "pnpm --filter @workspace/travel-estates run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/travel-estates", "run", "build" ]
serve = "static"
publicDir = "artifacts/travel-estates/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21629"
BASE_PATH = "/"
